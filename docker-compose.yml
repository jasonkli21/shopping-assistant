services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopping
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: shopping
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
